server:
  port: ${PORT:${SERVER_PORT:8081}}
  servlet:
    context-path: /

spring:
  application:
    name: food-department-backend
  datasource:
    url: ${DATABASE_URL:jdbc:h2:mem:food_department_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
    driver-class-name: ${DATABASE_DRIVER:org.h2.Driver}
    username: ${DATABASE_USERNAME:sa}
    password: ${DATABASE_PASSWORD:}
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: ${HIBERNATE_DIALECT:org.hibernate.dialect.H2Dialect}

govmesh:
  api-key: ${GOVMESH_API_KEY:gm-secret-key-2026-interop}
  callback-url: ${GOVMESH_CALLBACK_URL:https://sih-26129-gov-mesh-citizen.vercel.app/api/govmesh/callbacks/department-status}
  food:
    soap:
      endpoint-url: ${SOAP_ENDPOINT_URL:http://localhost:${server.port:8081}/ws}
  jwt:
    secret: ${JWT_SECRET:GovMeshFoodDept2026SuperSecretKeyDepartment2Maharashtra2026}
    expiration-ms: ${JWT_EXPIRATION_MS:1800000} # 30 Minutes

logging:
  level:
    root: INFO
    com.govmesh.food: DEBUG
    org.springframework.security: INFO
